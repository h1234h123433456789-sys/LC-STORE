<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 24K Royal Gold Metallic Gradient for Main Monogram -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E7618" />
      <stop offset="22%" stop-color="#D4AF37" />
      <stop offset="45%" stop-color="#F3D97D" />
      <stop offset="55%" stop-color="#DFB943" />
      <stop offset="78%" stop-color="#B8891E" />
      <stop offset="100%" stop-color="#8A6412" />
    </linearGradient>

    <!-- Rich Darker Gold for Subtitle & Fine Details -->
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7216" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7216" />
    </linearGradient>

    <!-- Luxury Gold Frame Gradient -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B38728" />
      <stop offset="28%" stop-color="#E6C567" />
      <stop offset="50%" stop-color="#C69C2E" />
      <stop offset="75%" stop-color="#E6C567" />
      <stop offset="100%" stop-color="#9A7216" />
    </linearGradient>

    <!-- Soft Luxury Drop Shadow for Monogram -->
    <filter id="monogramShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8A6412" flood-opacity="0.16" />
    </filter>

    <!-- Soft Shadow for Outer Frame -->
    <filter id="frameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B8860B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 1. Pure White Full-Bleed Canvas Background (#FFFFFF) -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- 2. Outer Luxury Squircle Frame (Centered at 256, 256) -->
  <g filter="url(#frameShadow)">
    <rect
      x="34"
      y="34"
      width="444"
      height="444"
      rx="98"
      ry="98"
      fill="#FFFFFF"
      stroke="url(#goldBorderGrad)"
      stroke-width="6.5"
    />
  </g>

  <!-- 3. Inner Double-Hairline Royal Border -->
  <rect
    x="48"
    y="48"
    width="416"
    height="416"
    rx="86"
    ry="86"
    fill="none"
    stroke="url(#goldBorderGrad)"
    stroke-width="1.6"
    opacity="0.55"
  />

  <!-- 4. Top Crown Star Emblem (Centered at X=256, Y=112) -->
  <g transform="translate(256, 112)">
    <!-- Left & Right Micro Diamonds -->
    <polygon points="-36,0 -31,-4 -26,0 -31,4" fill="#C59B27" opacity="0.75" />
    <polygon points="36,0 31,-4 26,0 31,4" fill="#C59B27" opacity="0.75" />
    <!-- Center 4-Point Royal Star -->
    <path
      d="M 0 -18 C 1.8 -5 5 -1.8 18 0 C 5 1.8 1.8 5 0 18 C -1.8 5 -5 1.8 -18 0 C -5 -1.8 -1.8 -5 0 -18 Z"
      fill="url(#royalGold)"
    />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- 5. Centerpiece Luxury Roman Serif "LC" Monogram (Exact Horizontal Center: X=134..378, Midpoint=256) -->
  <g filter="url(#monogramShadow)">
    <!-- Letter "L" (X: 134 to 244, Y: 152 to 304) -->
    <path
      d="M 134 152
         H 194
         V 160
         C 179 160 174 165 174 182
         V 278
         C 174 289 178 293 191 293
         H 212
         C 228 293 236 284 241 264
         H 248
         L 242 304
         H 134
         V 296
         C 147 296 151 291 151 274
         V 182
         C 151 165 147 160 134 160
         Z"
      fill="url(#royalGold)"
    />
    <!-- Inner Chisel Highlight on "L" Stem -->
    <rect x="160" y="164" width="2.2" height="128" fill="#FFF8DC" opacity="0.45" />

    <!-- Letter "C" (X: 256 to 378, Y: 149 to 307) -->
    <path
      d="M 374 151
         L 377 193
         H 369
         C 363 171 346 159 323 159
         C 296 159 281 184 281 228
         C 281 272 298 296 326 296
         C 348 296 364 285 373 266
         L 380 270
         C 369 295 348 307 320 307
         C 281 307 255 276 255 228
         C 255 180 283 149 322 149
         C 340 149 355 154 364 157
         C 367 158 370 156 372 151
         Z"
      fill="url(#royalGold)"
    />
    <!-- Inner Chisel Highlight on "C" Crescent -->
    <path
      d="M 271 190 C 266 215 266 241 271 266"
      fill="none"
      stroke="#FFF8DC"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.45"
    />
  </g>

  <!-- 6. Ornamental Gold Divider (Centered at X=256, Y=340 — well below LC at Y=307) -->
  <g transform="translate(256, 340)">
    <!-- Left Tapered Line -->
    <path d="M -105 0 L -16 -1.5 L -16 1.5 Z" fill="url(#deepGold)" opacity="0.85" />
    <!-- Center Diamond -->
    <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#royalGold)" />
    <!-- Right Tapered Line -->
    <path d="M 105 0 L 16 -1.5 L 16 1.5 Z" fill="url(#deepGold)" opacity="0.85" />
  </g>

  <!-- 7. Pure Vector "LC STORE" Subtitle (Centered at X=256, Y=374..394 — zero font overlap) -->
  <!-- Total width of "LC STORE" = 161.5px (X = 175.25 to 336.75, exact center = 256) -->
  <g fill="url(#deepGold)" transform="translate(175.25, 374)">
    <!-- L (0..13) -->
    <path d="M 0 0 H 3.5 V 17 H 13 V 20 H 0 Z" />
    <!-- C (20..36) -->
    <path d="M 35.5 3.5 C 33.2 1.5 30.8 0.5 28 0.5 C 22.2 0.5 18.5 4.6 18.5 10 C 18.5 15.4 22.2 19.5 28 19.5 C 30.8 19.5 33.3 18.4 35.6 16.3 L 33.6 14 C 31.9 15.7 30.1 16.5 28.1 16.5 C 24.3 16.5 22 13.9 22 10 C 22 6.1 24.3 3.5 28.1 3.5 C 30.1 3.5 31.8 4.2 33.5 5.8 Z" />

    <!-- S (52..66) -->
    <path d="M 65.2 3.2 C 63.3 1.4 60.8 0.5 58.2 0.5 C 53.8 0.5 51 2.9 51 6.1 C 51 9.5 54 10.7 57.7 11.6 C 60.8 12.4 62.5 13.2 62.5 14.8 C 62.5 16.5 60.7 17.5 58.1 17.5 C 55.6 17.5 53.4 16.4 51.7 14.7 L 49.7 17.2 C 51.9 19.2 54.9 20.4 58.1 20.4 C 62.9 20.4 66 18 66 14.5 C 66 11 63 9.7 59.1 8.7 C 56.1 7.9 54.5 7.2 54.5 5.7 C 54.5 4.2 56.1 3.3 58.3 3.3 C 60.3 3.3 62.1 4.1 63.5 5.4 Z" />
    <!-- T (73..89) -->
    <path d="M 73 0 H 89 V 3 H 82.75 V 20 H 79.25 V 3 H 73 Z" />
    <!-- O (95..115) -->
    <path d="M 105 0.5 C 99.1 0.5 95 4.6 95 10 C 95 15.4 99.1 19.5 105 19.5 C 110.9 19.5 115 15.4 115 10 C 115 4.6 110.9 0.5 105 0.5 Z M 105 3.5 C 108.9 3.5 111.5 6.2 111.5 10 C 111.5 13.8 108.9 16.5 105 16.5 C 101.1 16.5 98.5 13.8 98.5 10 C 98.5 6.2 101.1 3.5 105 3.5 Z" />
    <!-- R (123..139) -->
    <path d="M 123 0 H 131.5 C 136 0 138.8 2.4 138.8 6.2 C 138.8 9.2 137 11.3 134.1 12 L 139.5 20 H 135.5 L 130.6 12.4 H 126.5 V 20 H 123 Z M 126.5 3 V 9.6 H 131.2 C 133.9 9.6 135.3 8.3 135.3 6.3 C 135.3 4.3 133.9 3 131.2 3 Z" />
    <!-- E (147..161) -->
    <path d="M 147 0 H 161 V 3 H 150.5 V 8.3 H 159.5 V 11.3 H 150.5 V 17 H 161.5 V 20 H 147 Z" />
  </g>
</svg>